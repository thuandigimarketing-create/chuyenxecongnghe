<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi: Chuyến Xe Công Nghệ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'Comic Sans MS', sans-serif;
        }
        body {
            background-color: #e0f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #2c3e50;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ff6b6b;
            font-size: 2.5em;
            text-shadow: 2px 2px 0px #fff;
            margin-bottom: 5px;
        }
        .header p {
            color: #34495e;
            font-size: 1.1em;
            font-style: italic;
            font-weight: bold;
        }

        .game-container {
            background: white;
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
        }
        .input-group {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group label {
            font-weight: bold;
            color: #2980b9;
        }
        .input-group input {
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            font-size: 1.1em;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #3498db;
        }
        .btn-start {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
            transition: transform 0.2s, background-color 0.3s;
            margin-top: 10px;
        }
        .btn-start:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }

        #quiz-screen {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        
        .progress-container {
            width: 100%;
            height: 60px;
            background-color: #ecf0f1;
            border-radius: 30px;
            position: relative;
            margin-bottom: 20px;
            border: 2px solid #bdc3c7;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            border-radius: 30px;
            transition: width 0.5s ease;
        }
        .bus-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            font-size: 2em;
            transition: left 0.5s ease;
            margin-left: 10px;
        }
        
        .student-info-bar {
            display: flex;
            justify-content: space-between;
            background-color: #f8f9fa;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            color: #2c3e50;
            border-left: 5px solid #3498db;
        }

        .question-container {
            background-color: #fff9c4;
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed #f1c40f;
        }
        .question-text {
            font-size: 1.4em;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 20px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .option-btn {
            background-color: #ffffff;
            border: 2px solid #bdc3c7;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1em;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            color: #2c3e50;
            display: flex;
            align-items: center;
        }
        .option-btn:hover {
            background-color: #ebf5fb;
            border-color: #3498db;
            transform: translateX(5px);
        }
        .option-btn.correct {
            background-color: #d5f5e3;
            border-color: #2ecc71;
            color: #27ae60;
            font-weight: bold;
        }
        .option-btn.wrong {
            background-color: #fadbd8;
            border-color: #e74c3c;
            color: #c0392b;
        }

        #next-btn {
            display: none;
            align-self: flex-end;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #next-btn:hover {
            background-color: #2980b9;
        }
        #teacher-note {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #28a745;
            margin-top: 15px;
            font-style: italic;
            font-size: 1.1em;
            animation: fadeIn 0.5s ease;
        }

        #result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            padding: 30px 0;
        }
        .trophy {
            font-size: 5em;
            animation: bounce 2s infinite;
        }
        .result-details {
            background-color: #f1f8ff;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #a4c9f3;
            width: 100%;
            max-width: 500px;
        }
        .result-details p {
            font-size: 1.2em;
            margin: 10px 0;
            color: #34495e;
        }
        .highlight {
            font-weight: bold;
            color: #e74c3c;
            font-size: 1.3em;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 600px) {
            .header h1 { font-size: 2em; }
            .game-container { padding: 15px; }
            .option-btn { font-size: 1em; padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚌 CHUYẾN XE CÔNG NGHỆ 🚌</h1>
        <p>Tác giả: Cô Nguyễn Thị Thuần - Trường TH Hạp Lĩnh</p>
    </div>

    <div class="game-container">
        
        <div id="login-screen">
            <h2 style="color: #2980b9;">Sẵn sàng khởi hành chưa?</h2>
            
            <div class="input-group">
                <label for="studentName">Họ và tên học sinh:</label>
                <input type="text" id="studentName" placeholder="Nhập tên của em..." autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="studentClass">Lớp:</label>
                <input type="text" id="studentClass" placeholder="VD: 4A, 4B..." autocomplete="off">
            </div>
            
            <button class="btn-start" onclick="startGame()">LÊN XE XUẤT PHÁT! 🚀</button>
            <p id="login-error" style="color: red; display: none;">Vui lòng nhập đầy đủ Tên và Lớp nhé!</p>
        </div>

        <div id="quiz-screen">
            <div class="student-info-bar">
                <span id="display-info">Hành khách: </span>
                <span id="timer-display">⏱️ Thời gian: 00:00</span>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
                <div class="bus-icon" id="bus-icon">🚌</div>
            </div>

            <div class="question-container">
                <div class="question-text" id="question-text">Đang tải câu hỏi...</div>
                <div class="options-grid" id="options-container">
                    <!-- Javascript sẽ tự động thêm các nút đáp án vào đây -->
                </div>
            </div>

            <div id="teacher-note"></div>
            <button id="next-btn" onclick="nextQuestion()">Trạm tiếp theo ➡️</button>
        </div>

        <div id="result-screen">
            <div class="trophy">🏆</div>
            <h1 style="color: #2ecc71;">CHÚC MỪNG EM VỀ ĐÍCH!</h1>
            
            <div class="result-details">
                <p>Hành khách: <span class="highlight" id="res-name"></span></p>
                <p>Lớp: <span class="highlight" id="res-class"></span></p>
                <p>Điểm số: <span class="highlight" id="res-score"></span> / 5</p>
                <p>Tổng thời gian: <span class="highlight" id="res-time"></span></p>
            </div>
            
            <button class="btn-start" onclick="location.reload()">Chơi Lại</button>
        </div>

    </div>

    <script>
        const questions = [
            {
                q: "1. Khởi động: Bạn Lan muốn chuyển một tệp bài vẽ từ thư mục Nhom 1 sang thư mục Nhom 2. Lan muốn tệp bài vẽ đó KHÔNG CÒN ở thư mục Nhom 1 nữa. Lan phải dùng thao tác nào?",
                options: [
                    "A. Sao chép (Copy)",
                    "B. Di chuyển (Move)",
                    "C. Đổi tên (Rename)",
                    "D. Xoá (Delete)"
                ],
                correctIndex: 1,
                note: "Lời chốt của Cô: Khi chúng ta muốn 'chuyển nhà' cho dữ liệu đi nơi khác và không để lại bản gốc, thao tác duy nhất là Di chuyển (Move). Việc này giúp máy tính gọn gàng hơn."
            },
            {
                q: "2. Vượt chướng ngại vật: Để chia sẻ tệp bài tập trình chiếu cho bạn cùng bàn mà em vẫn muốn giữ lại tệp đó trên máy của mình, em sẽ dùng thao tác nào?",
                options: [
                    "A. Xoá tệp đó đi",
                    "B. Di chuyển tệp đó sang máy bạn",
                    "C. Đổi tên tệp thành tên của bạn",
                    "D. Sao chép tệp đó sang USB rồi gửi bạn"
                ],
                correctIndex: 3,
                note: "Lời chốt của Cô: Thao tác Sao chép (Copy) giống như 'nhân bản'. Dữ liệu sẽ có ở cả hai nơi, giúp chia sẻ thông tin an toàn mà không mất tài liệu gốc."
            },
            {
                q: "3. Tăng tốc: Hành động nào dưới đây KHÔNG NÊN làm khi thực hành trên phòng máy của trường?",
                options: [
                    "A. Tạo thư mục mang tên mình để lưu bài",
                    "B. Tự ý xoá thư mục bài tập của bạn khác cho nhẹ máy",
                    "C. Lưu bài vẽ vào đúng thư mục cá nhân",
                    "D. Đổi tên tệp nháp do chính mình tạo ra"
                ],
                correctIndex: 1,
                note: "Lời chốt của Cô: Tự ý can thiệp vào thư mục của người khác sẽ làm mất thông tin. Em hãy nhớ chỉ thao tác trên tệp và thư mục do chính mình tạo ra thôi nhé."
            },
            {
                q: "4. Về đích: Nếu em sao chép quá nhiều phim hoạt hình rải rác khắp nơi trên máy tính thì điều gì sẽ xảy ra?",
                options: [
                    "A. Máy tính chạy nhanh hơn",
                    "B. Màn hình sáng và đẹp hơn",
                    "C. Khó quản lý tệp và làm tốn bộ nhớ",
                    "D. Máy tính biến thành chiếc tivi"
                ],
                correctIndex: 2,
                note: "Lời chốt của Cô: Sao chép quá nhiều sẽ gây lãng phí bộ nhớ. Lưu trữ có tổ chức là kỹ năng số rất quan trọng giúp em tìm kiếm tài liệu nhanh hơn."
            },
            {
                q: "5. Ngôi sao hy vọng (Năng lực AI): Vì sao chúng ta cần thường xuyên dọn dẹp thư mục cá nhân, xoá ảnh hỏng, mờ?",
                options: [
                    "A. Để AI học từ dữ liệu chuẩn và tạo ra video/hình ảnh đẹp hơn",
                    "B. Để máy tính bị lỗi chương trình",
                    "C. Để người khác không xem được ảnh",
                    "D. Để làm tốn bộ nhớ"
                ],
                correctIndex: 0,
                note: "Lời chốt của Cô: Máy tính hay AI đều học từ dữ liệu chúng ta cung cấp. Dữ liệu càng ngăn nắp, con người càng cẩn thận dọn dẹp thì AI làm việc càng thông minh và chuẩn xác!"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let studentData = { name: '', class: '' };
        
        let timerInterval;
        let totalSeconds = 0;
        let hasAnsweredCurrent = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'victory') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
                    g.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.15);
                    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.4);
                    o.start(audioCtx.currentTime + i * 0.15);
                    o.stop(audioCtx.currentTime + i * 0.15 + 0.4);
                });
            }
        }

        function startGame() {
            const nameInput = document.getElementById('studentName').value.trim();
            const classInput = document.getElementById('studentClass').value.trim();
            const errorMsg = document.getElementById('login-error');

            if (nameInput === '' || classInput === '') {
                errorMsg.style.display = 'block';
                return;
            }

            studentData.name = nameInput;
            studentData.class = classInput;
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'flex';
            
            document.getElementById('display-info').innerHTML = `Hành khách: <span style="color:#e74c3c">${studentData.name}</span> - Lớp: <span style="color:#e74c3c">${studentData.class}</span>`;
            
            startTimer();
            loadQuestion();
            updateProgress();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                totalSeconds++;
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                document.getElementById('timer-display').innerText = 
                    `⏱️ Thời gian: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function formatTime(totalSec) {
            const minutes = Math.floor(totalSec / 60);
            const seconds = totalSec % 60;
            return `${minutes} phút ${seconds} giây`;
        }

        function updateProgress() {
            const percentage = (currentQuestionIndex / questions.length) * 100;
            document.getElementById('progress-bar').style.width = percentage + '%';
            
            const busPosition = (currentQuestionIndex / questions.length) * 90;
            document.getElementById('bus-icon').style.left = busPosition + '%';
        }

        function loadQuestion() {
            hasAnsweredCurrent = false;
            document.getElementById('teacher-note').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            
            const qData = questions[currentQuestionIndex];
            document.getElementById('question-text').innerText = qData.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; 
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btnElement) {
            if (hasAnsweredCurrent) return; 
            hasAnsweredCurrent = true;
            
            const qData = questions[currentQuestionIndex];
            const allButtons = document.querySelectorAll('.option-btn');
            
            allButtons.forEach(btn => btn.style.cursor = 'not-allowed');
            
            if (selectedIndex === qData.correctIndex) {
                btnElement.classList.add('correct');
                score++;
                playSound('correct');
            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                allButtons[qData.correctIndex].classList.add('correct');
            }

            const noteEl = document.getElementById('teacher-note');
            noteEl.innerText = qData.note;
            noteEl.style.display = 'block';

            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.innerText = "Xem Kết Quả Về Đích 🏁";
            }
            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            updateProgress();
            
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            clearInterval(timerInterval); 
            
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('bus-icon').style.left = '92%';
            
            document.getElementById('res-name').innerText = studentData.name;
            document.getElementById('res-class').innerText = studentData.class;
            document.getElementById('res-score').innerText = score;
            document.getElementById('res-time').innerText = formatTime(totalSeconds);
            
            playSound('victory');
        }
    </script>
</body>
</html>
